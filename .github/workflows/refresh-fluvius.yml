name: Refresh Fluvius grid data

on:
  schedule:
    # GitHub cron uses UTC. This runs at 06:15 CET / 07:15 CEST.
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fluvius-grid-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Reject tracked CSV exports
        shell: bash
        run: |
          if test -n "$(git ls-files '*.csv')"; then
            echo "A raw CSV export is tracked. Remove it before running this workflow."
            exit 1
          fi

      - name: Check Fluvius reachability
        shell: pwsh
        run: |
          curl https://api.ipify.org
      #     curl -v ${{ secrets.FLUVIUS_DETAIL_URL }}
      #     $diagnostic = & curl.exe --ipv4 --silent --show-error --output NUL --connect-timeout 30 --max-time 45 --write-out "http=%{http_code} remote_ip=%{remote_ip} connect=%{time_connect}s total=%{time_total}s" https://mijn.fluvius.be/verbruik 2>&1
      #     $curlExitCode = $LASTEXITCODE
      #     Write-Host "Fluvius reachability: curl_exit=$curlExitCode $diagnostic"
      #     if ($curlExitCode -ne 0) {
      #       Write-Error "The Windows-hosted runner could not establish an HTTPS connection to Mijn Fluvius."
      #       exit 1
      #     }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download and sanitize Fluvius data through the API
        run: npm run sync:fluvius
        env:
          FLUVIUS_EMAIL: ${{ secrets.FLUVIUS_EMAIL }}
          FLUVIUS_PASSWORD: ${{ secrets.FLUVIUS_PASSWORD }}
          FLUVIUS_DETAIL_URL: ${{ secrets.FLUVIUS_DETAIL_URL }}
          FLUVIUS_METER_SERIAL: ${{ secrets.FLUVIUS_METER_SERIAL }}
          FLUVIUS_TRANSPORT: api

      - name: Commit sanitized supplement
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/grid-supplement.json; then
            echo "The sanitized supplement is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/grid-supplement.json
          git commit -m "chore(data): refresh Fluvius grid supplement"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${{ github.event.repository.default_branch }}"