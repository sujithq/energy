name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  workflow_run:
    workflows:
      - Refresh Fluvius grid data
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Reject tracked CSV exports
        shell: bash
        run: |
          if test -n "$(git ls-files '*.csv')"; then
            echo "A raw CSV export is tracked. Remove it before deploying."
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage public site
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js .nojekyll _site/
          cp data/grid-supplement.json _site/data/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4